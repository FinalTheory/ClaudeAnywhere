<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude Remote</title>
<!-- Order matters: vars before the stylesheet that consumes them, both
     before our own overrides. See the comment at the top of style.css. -->
<link rel="stylesheet" href="/static/vscode-vars.css">
<link rel="stylesheet" href="/static/claude-webview.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="session-list">
  <div id="list-actions">
    <form id="new-session-form">
      <textarea id="new-session-input" rows="1" placeholder="Start a new conversation" autocomplete="off"></textarea>
      <button type="submit">Start</button>
    </form>
    <div id="new-session-status"></div>
    <div id="mcp-section">
      <button id="mcp-refresh" type="button">MCP servers</button>
      <div id="mcp-list"></div>
    </div>
  </div>
  <div id="session-rows"></div>
</div>
<div id="session-detail" style="display:none">
  <button id="back-btn">&larr; Back</button>
  <span id="session-title"></span>
  <span id="status"></span>
  <div id="notice" hidden></div>
  <div id="transcript"></div>
  <form id="send-form">
    <textarea id="prompt-input" rows="1" placeholder="Message" autocomplete="off"></textarea>
    <button type="submit">Send</button>
  </form>
</div>
<script src="/static/app.js"></script>
</body>
</html>
