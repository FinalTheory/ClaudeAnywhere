<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Added to the home screen, this is the icon and the name it gets.
     apple-mobile-web-app-capable drops Safari's chrome, which is most of
     the screen back on a phone. -->
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="icon" href="/static/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ClaudeAnywhere">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Login</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #1e1e1e;
    background-attachment: fixed;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: min(320px, 85vw);
  }
  input[type="password"] {
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #444;
    background: #2a2a2a;
    color: #eee;
    font-size: 16px; /* avoids iOS auto-zoom on focus */
  }
  button[type="submit"] {
    padding: 12px 14px;
    border-radius: 10px;
    border: none;
    background: #0e639c;
    color: #fff;
    font-size: 15px;
  }
  button[type="submit"]:active {
    background: #1177bb;
  }
  .error {
    color: #f48771;
    font-size: 13px;
    min-height: 1em;
    text-align: center;
  }
</style>
</head>
<body>
<form method="post" action="/login">
  <input type="password" name="password" placeholder="Password" autofocus autocomplete="current-password">
  <button type="submit">Enter</button>
  <p class="error">{{error}}</p>
</form>
</body>
</html>
